# Your personal JARVIS profile: what JARVIS may open for you.
# JARVIS can ONLY open things listed here. Edit freely, then restart JARVIS.
#
# Paths: use single quotes so backslashes are safe. %USERPROFILE% and %LOCALAPPDATA% work.
# "names" are other ways you might say it; the speech recogniser is taught these too.

owner_name: Lesiba

# Where you are, for the weather. Only these coordinates are sent to the weather service.
location:
  name: Pretoria
  latitude: -25.7479
  longitude: 28.2293
  address: ''               # your home address: used for maps, "near me" and directions (Settings can edit it)

# Your music: "play <album> in VLC" searches this folder (albums can be one or two levels down).
music:
  # PLACEHOLDER: change this to the real path of your music folder.
  folder: 'G:\Music'
  player: vlc               # the key of an app below
  online: youtube_music     # what "play X" uses when you are online (youtube_music, youtube or local); offline it always uses this folder

# Your main drive(s). JARVIS may open any folder on it by name ("open the main folder", "open the
# movies folder") and play videos from it in VLC ("play the movie Dune"). It never changes or deletes anything.
drives:
  - 'G:\'

# Saved contacts for "write an email to <name>". JARVIS only opens a Gmail draft; you press send.
# contacts:
#   mum:
#     label: Mum
#     names: [mother, mom]
#     email: mum@example.com

apps:
  vscode:
    label: VS Code
    names: [visual studio code, vs code, vscode, code]
    candidates:
      - '%LOCALAPPDATA%\Programs\Microsoft VS Code\Code.exe'
      - 'C:\Program Files\Microsoft VS Code\Code.exe'
      - code
    folder_mode: arg          # "open VS Code in LightsOn" opens that folder

  chrome:
    label: Chrome
    names: [google chrome, chrome, browser]
    candidates:
      - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
      - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
      - '%LOCALAPPDATA%\Google\Chrome\Application\chrome.exe'
      - chrome

  powerbi:
    label: Power BI
    names: [power bi, power bi desktop, powerbi]
    candidates:
      # Installed from the Microsoft Store instead? Find PBIDesktop.exe and put its path here.
      - 'C:\Program Files\Microsoft Power BI Desktop\bin\PBIDesktop.exe'
      - PBIDesktop

  jupyter:
    label: Jupyter
    names: [jupyter lab, jupyterlab, jupyter notebook, notebook]
    candidates: [jupyter]     # must be installed and on your PATH, or give its full path
    args: [lab]
    folder_mode: cwd          # "open Jupyter in LightsOn" starts it inside that folder

  vlc:
    label: VLC
    names: [vlc media player, media player, v l c]
    candidates:
      - 'C:\Program Files\VideoLAN\VLC\vlc.exe'
      - 'C:\Program Files (x86)\VideoLAN\VLC\vlc.exe'
      - vlc

  flstudio:
    label: FL Studio
    names: [fl studio, fl, fruity loops, fruity loops studio, f l studio]
    # The folder name changes with the version. If JARVIS can't find it, run:
    #   python -m jarvis add-app "FL Studio"
    candidates:
      - 'C:\Program Files\Image-Line\FL Studio 2025\FL64.exe'
      - 'C:\Program Files\Image-Line\FL Studio 2024\FL64.exe'
      - 'C:\Program Files\Image-Line\FL Studio 21\FL64.exe'
      - 'C:\Program Files\Image-Line\FL Studio 20\FL64.exe'
      - FL64

folders:
  portfolio:
    label: portfolio
    names: [portfolio, portfolio projects]
    path: 'G:\Study\DATA SCINCE\PROJECTS\POTFOLIO'

  jarvis:
    label: JARVIS
    names: [jarvis project, jarvis folder]
    path: 'G:\Study\DATA SCINCE\PROJECTS\POTFOLIO\jarvis'

  dune:
    label: Dune
    names: [dune, j mine, personal os]
    path: 'G:\Study\DATA SCINCE\PROJECTS\POTFOLIO\j_mine_personal_os'

  lightson:
    label: LightsOn
    names: [lights on, solar project, solar, battery project]
    # Check this path: it is my guess, next to your other projects.
    path: 'G:\Study\DATA SCINCE\PROJECTS\POTFOLIO\lightson-solar-battery-forecasting'

  downloads:
    label: Downloads
    path: '%USERPROFILE%\Downloads'

  documents:
    label: Documents
    path: '%USERPROFILE%\Documents'

  music:
    label: Music
    names: [my music, music folder, songs]
    path: 'G:\Music'         # PLACEHOLDER: same as `music: folder` above

websites:
  databricks:
    label: Databricks
    names: [databricks, data bricks]
    url: ''                   # put your workspace address here, e.g. https://adb-123456789.1.azuredatabricks.net
    app: chrome

  github:
    label: GitHub
    names: [my github, git hub]
    url: https://github.com/JmineSA
    app: chrome

  gmail:
    label: Gmail
    names: [email, my email, emails, mail, inbox, my inbox, g mail]
    url: https://mail.google.com
    app: chrome

  youtube:
    label: YouTube
    names: [you tube]
    url: https://www.youtube.com
    app: chrome

  youtubemusic:
    label: YouTube Music
    names: [you tube music, yt music, music streaming]
    url: https://music.youtube.com
    app: chrome
