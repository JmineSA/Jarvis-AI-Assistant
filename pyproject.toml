[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Modular, local, voice-controlled personal AI assistant"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# JARVIS is a local-time desktop app, and tool calls must never crash the loop, so naive datetimes
# (DTZ) and broad excepts (BLE001) are intentional.
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E741", "B008", "B905", "UP042", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "RUF012"]
